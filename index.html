<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SET Quilt Generator</title>
    <style>
        :root { 
            --line-color: #333; 
            --highlight: #ffff3b; 
            --user-placed: #28a745;
            --bg: #f8f9fa;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: row; 
            gap: 20px; 
            background: var(--bg); 
            padding: 10px; 
            justify-content: center;
            flex-wrap: wrap;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
            overflow: hidden; 
        }
        
        #grid-container { 
            display: grid; 
            grid-template-columns: repeat(9, 11.11%); 
            grid-template-rows: repeat(9, 11.11%);
            height: 85vh; 
            max-height: 800px;
            aspect-ratio: 9 / 10.5; 
            gap: 1px; 
            background: #999; 
            border: 3px solid var(--line-color);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .cell { 
            background: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            cursor: pointer; 
            border: 0px solid transparent; 
            box-sizing: border-box;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .cell svg {
            width: 85%;
            height: 85%;
            pointer-events: none;
        }

        .cell.selected { outline: 3px solid #007bff; z-index: 10; }
        .cell.forcing { background: var(--highlight) !important; }
        .cell.user-placed { border: clamp(3px, 0.5vh, 8px) solid var(--user-placed) !important; }
        
        .cell:nth-child(3n) { border-right: 2px solid var(--line-color); }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27), 
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--line-color); }

        .sidebar { 
            width: 100%; 
            max-width: 340px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            max-height: 90vh;
        }

        .controls { 
            background: white; padding: 12px; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .button-row {
            display: flex;
            gap: 6px;
        }

        /* COMPACT DECK VIEW - 6 columns wide on desktop */
        .deck-view { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 4px; 
            overflow-y: auto; 
            flex-grow: 1; 
            background: white; 
            padding: 8px; 
            border-radius: 12px; 
            border: 1px solid #ddd; 
        }

        .deck-card { 
            aspect-ratio: 3 / 4;
            border: 1px solid #eee; 
            cursor: pointer; 
            border-radius: 4px; 
            display: flex; 
            justify-content: center;
            align-items: center;
            transition: transform 0.1s, border-color 0.1s;
        }

        .deck-card:hover:not(.used) {
            border-color: #007bff;
            transform: scale(1.05);
            z-index: 2;
        }

        .deck-card svg {
            width: 80%;
            height: 80%;
        }

        .deck-card.used { opacity: 0.1; cursor: not-allowed; filter: grayscale(1); }
        
        input[type=range] { width: 100%; }
        button { 
            width: 100%; padding: 8px; background: #007bff; color: white; 
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        button.secondary { background: #6c757d; }

        @media (max-width: 900px) {
            body { overflow-y: auto; height: auto; }
            #grid-container { width: 95vw; height: auto; aspect-ratio: 9/10.5; }
            .sidebar { max-width: none; }
        }
    </style>
</head>
<body>

<div id="grid-container"></div>

<div class="sidebar">
    <div class="controls">
        <h3 style="margin:0 0 2px 0; font-size: 1rem;">SET Quilt</h3>
        <div class="button-row">
            <button id="btn-prev" onclick="stepBackward()" disabled>◀ Back</button>
            <button id="btn-next" onclick="stepForward()" disabled>Next ▶</button>
        </div>
        <div class="button-row">
            <button id="btn-play" onclick="toggleAutoPlay()" class="secondary" disabled>Auto</button>
            <button onclick="resetGrid()" class="secondary">Reset</button>
        </div>
        <label style="font-size: 0.8rem; margin-top: 4px;">Auto Speed</label>
        <input type="range" id="speed" min="100" max="1500" value="600">
    </div>
    <div id="deck" class="deck-view"></div>
</div>

<script>
    let grid = Array(81).fill(null);
    let selectedCell = null;
    let gridSets = {};
    
    let historySteps = []; 
    let currentStepIndex = -1; 
    let subPhase = 1; // 0 = highlighting forcing partners only, 1 = card placed with highlighting
    let isPlaying = false;
    let playInterval = null;

    const PATHS = [
        "M 10,12 H 30 A 8,8 0 0 1 30,28 H 10 A 8,8 0 0 1 10,12 Z",
        "M 35.1 14.2 C 37.9 20.2, 30.3 26.7, 21.4 24.8 C 17.8 24.1, 14.4 21.5, 9.4 24.5 C 3.5 28.0, 2.1 26.0, 2.0 21.0 C 1.9 16.1, 6.7 12.8, 12.4 13.4 C 20.1 14.3, 21.1 18.7, 30.1 13.9 C 32.2 12.8, 34.1 12.0, 35.1 14.2 Z",
        "M 20,8 L 36,20 L 20,32 L 4,20 Z"
    ];
    const COLORS = ["#ef233c", "#7209b7", "#38b000"];

    function getCardSVG(card) {
        const [shapeIdx, colorIdx, numIdx, shadeIdx] = card;
        const color = COLORS[colorIdx];
        const path = PATHS[shapeIdx];
        const count = numIdx + 1;
        
        let fill = color;
        if (shadeIdx === 1) fill = `url(#stripes-${colorIdx})`;
        if (shadeIdx === 2) fill = "none";

        let shapes = "";
        const offsets = count === 1 ? [25] : count === 2 ? [10, 40] : [-5, 25, 55];
        
        offsets.forEach(y => {
            shapes += `<path d="${path}" transform="translate(0, ${y})" fill="${fill}" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" />`;
        });

        return `
            <svg viewBox="0 0 40 95" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <pattern id="stripes-${colorIdx}" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(45)">
                        <line x1="0" y1="0" x2="0" y2="3" stroke="${color}" stroke-width="1.2" />
                    </pattern>
                </defs>
                ${shapes}
            </svg>`;
    }

    function cardToGridIdx(card) {
        const [R, C, r, c] = card;
        return (3 * R + r) * 9 + (3 * C + c);
    }

    function init() {
        const fullDeck = [];
        for (let R=0; R<3; R++) for (let C=0; C<3; C++) 
        for (let r=0; r<3; r++) for (let c=0; c<3; c++) fullDeck.push([R, C, r, c]);

        fullDeck.forEach((A, i) => {
            let posA = cardToGridIdx(A);
            gridSets[posA] = [];
            fullDeck.forEach((B, j) => {
                if (i === j) return;
                let C = A.map((val, k) => (6 - (val + B[k])) % 3);
                if (B.join('') < C.join('')) {
                    gridSets[posA].push({posB: cardToGridIdx(B), posC: cardToGridIdx(C)});
                }
            });
        });
        renderGrid();
        renderDeck();
    }

    function renderGrid() {
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        for (let i = 0; i < 81; i++) {
            const div = document.createElement('div');
            div.className = 'cell';
            div.id = `cell-${i}`;
            div.onclick = () => {
                const isAtLatest = (currentStepIndex === historySteps.length - 1 && (historySteps[currentStepIndex]?.type !== 'deduction' || subPhase === 1)) || currentStepIndex === -1;
                if (grid[i] || isPlaying || !isAtLatest) return;
                document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
                div.classList.add('selected');
                selectedCell = i;
            };
            container.appendChild(div);
        }
    }

    function renderDeck() {
        const deckDiv = document.getElementById('deck');
        deckDiv.innerHTML = '';
        for (let R=0; R<3; R++) for (let C=0; C<3; C++) 
        for (let r=0; r<3; r++) for (let c=0; c<3; c++) {
            const card = [R, C, r, c];
            const used = grid.some(g => g && g.join('') === card.join(''));
            const d = document.createElement('div');
            d.className = `deck-card ${used ? 'used' : ''}`;
            d.innerHTML = getCardSVG(card);
            d.onclick = () => { 
                const isAtLatest = (currentStepIndex === historySteps.length - 1 && (historySteps[currentStepIndex]?.type !== 'deduction' || subPhase === 1)) || currentStepIndex === -1;
                if (!used && selectedCell !== null && !isPlaying && isAtLatest) {
                    addUserCard(card, selectedCell);
                }
            };
            deckDiv.appendChild(d);
        }
    }

    function findNextDeduction(currentGrid) {
        for (let pos = 0; pos < 81; pos++) {
            if (!currentGrid[pos]) continue;
            let cardA = currentGrid[pos];
            for (let set of gridSets[pos]) {
                let cardB = currentGrid[set.posB];
                let cardC = currentGrid[set.posC];
                let target = null;
                let partner = null;

                if (cardB && !cardC) { target = set.posC; partner = set.posB; }
                else if (!cardB && cardC) { target = set.posB; partner = set.posC; }

                if (target !== null && !currentGrid[target]) {
                    let third = cardA.map((v, i) => (6 - (v + currentGrid[partner][i])) % 3);
                    return {
                        target: target,
                        card: third,
                        partner1: pos,
                        partner2: partner
                    };
                }
            }
        }
        return null;
    }

    function addUserCard(card, pos) {
        stopAutoPlay();
        historySteps = historySteps.slice(0, currentStepIndex + 1);

        const step = {
            type: 'user',
            pos: pos,
            card: card
        };

        historySteps.push(step);
        currentStepIndex = historySteps.length - 1;
        subPhase = 1;
        applyStepState();
    }

    function applyStepState() {
        grid.fill(null);
        
        for (let i = 0; i < 81; i++) {
            const cell = document.getElementById(`cell-${i}`);
            cell.innerHTML = '';
            cell.className = 'cell';
        }

        let activeForcingPairs = new Set();
        let tempGrid = Array(81).fill(null);

        for (let idx = 0; idx <= currentStepIndex; idx++) {
            let step = historySteps[idx];
            if (step.type === 'user') {
                tempGrid[step.pos] = step.card;
            } else if (step.type === 'deduction') {
                if (idx === currentStepIndex && subPhase === 0) {
                    activeForcingPairs.add(step.partner1);
                    activeForcingPairs.add(step.partner2);
                } else {
                    tempGrid[step.target] = step.card;
                    if (idx === currentStepIndex && subPhase === 1) {
                        activeForcingPairs.add(step.partner1);
                        activeForcingPairs.add(step.partner2);
                    }
                }
            }
        }

        for (let i = 0; i < 81; i++) {
            if (tempGrid[i]) {
                grid[i] = tempGrid[i];
                const cell = document.getElementById(`cell-${i}`);
                cell.innerHTML = getCardSVG(tempGrid[i]);
                let isUser = historySteps.some(s => s.type === 'user' && s.pos === i);
                if (isUser) {
                    cell.classList.add('user-placed');
                }
            }
        }

        activeForcingPairs.forEach(p => {
            const c = document.getElementById(`cell-${p}`);
            if (c) c.classList.add('forcing');
        });

        renderDeck();
        selectedCell = null;
        updateButtonStates();
    }

    function updateButtonStates() {
        document.getElementById('btn-prev').disabled = currentStepIndex < 0 || isPlaying;
        
        let currStep = historySteps[currentStepIndex];
        let canStepFwd = false;

        if (currStep && currStep.type === 'deduction' && subPhase === 0) {
            canStepFwd = true;
        } else if (currentStepIndex < historySteps.length - 1) {
            canStepFwd = true;
        } else {
            let tempGrid = Array(81).fill(null);
            for (let i = 0; i <= currentStepIndex; i++) {
                let s = historySteps[i];
                if (s.type === 'user') tempGrid[s.pos] = s.card;
                if (s.type === 'deduction') tempGrid[s.target] = s.card;
            }
            if (findNextDeduction(tempGrid)) {
                canStepFwd = true;
            }
        }

        document.getElementById('btn-next').disabled = !canStepFwd || isPlaying;

        const playBtn = document.getElementById('btn-play');
        let hasCards = historySteps.some(s => s.type === 'user');
        playBtn.disabled = !hasCards || (!canStepFwd && !isPlaying);
    }

    function stepForward() {
        let currStep = historySteps[currentStepIndex];

        if (currStep && currStep.type === 'deduction' && subPhase === 0) {
            subPhase = 1;
            applyStepState();
            return;
        }

        if (currentStepIndex < historySteps.length - 1) {
            currentStepIndex++;
            let nextStep = historySteps[currentStepIndex];
            subPhase = (nextStep.type === 'deduction') ? 0 : 1;
            applyStepState();
        } else {
            let tempGrid = Array(81).fill(null);
            for (let i = 0; i <= currentStepIndex; i++) {
                let s = historySteps[i];
                if (s.type === 'user') tempGrid[s.pos] = s.card;
                if (s.type === 'deduction') tempGrid[s.target] = s.card;
            }

            let deduction = findNextDeduction(tempGrid);
            if (deduction) {
                historySteps.push({
                    type: 'deduction',
                    target: deduction.target,
                    card: deduction.card,
                    partner1: deduction.partner1,
                    partner2: deduction.partner2
                });
                currentStepIndex++;
                subPhase = 0;
                applyStepState();
            }
        }
    }

    function stepBackward() {
        let currStep = historySteps[currentStepIndex];

        if (currStep && currStep.type === 'deduction' && subPhase === 1) {
            subPhase = 0;
            applyStepState();
            return;
        }

        if (currentStepIndex >= 0) {
            currentStepIndex--;
            let prevStep = historySteps[currentStepIndex];
            subPhase = (prevStep && prevStep.type === 'deduction') ? 1 : 1;
            applyStepState();
        }
    }

    function toggleAutoPlay() {
        if (isPlaying) {
            stopAutoPlay();
        } else {
            isPlaying = true;
            document.getElementById('btn-play').innerText = "Pause";
            updateButtonStates();
            
            const getSpeed = () => parseInt(document.getElementById('speed').value);
            
            playInterval = setInterval(() => {
                let currStep = historySteps[currentStepIndex];
                let canStep = (currStep && currStep.type === 'deduction' && subPhase === 0) || (currentStepIndex < historySteps.length - 1);
                
                if (!canStep) {
                    let tempGrid = Array(81).fill(null);
                    for (let i = 0; i <= currentStepIndex; i++) {
                        let s = historySteps[i];
                        if (s.type === 'user') tempGrid[s.pos] = s.card;
                        if (s.type === 'deduction') tempGrid[s.target] = s.card;
                    }
                    if (findNextDeduction(tempGrid)) {
                        canStep = true;
                    }
                }

                if (canStep) {
                    stepForward();
                } else {
                    stopAutoPlay();
                }
            }, 1600 - getSpeed());
        }
    }

    function stopAutoPlay() {
        isPlaying = false;
        clearInterval(playInterval);
        const playBtn = document.getElementById('btn-play');
        if (playBtn) playBtn.innerText = "Auto-Propagate";
        updateButtonStates();
    }

    function resetGrid() {
        stopAutoPlay();
        grid.fill(null);
        historySteps = [];
        currentStepIndex = -1;
        subPhase = 1;
        renderGrid();
        renderDeck();
        updateButtonStates();
    }

    init();
</script>
</body>
</html>
